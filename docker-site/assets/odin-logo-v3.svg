        stroke-linejoin="round"/>

  <path d="M112 63 L88 78 L94 106 L111 94 Z"
        fill="#12171a"
        stroke="#a5c736"
        stroke-opacity="0.32"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Muzzle -->
  <path d="M64 92
           L80 80
           L96 92
           L91 114
           L80 123
           L69 114
