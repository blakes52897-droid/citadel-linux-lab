        stroke="#a5c736"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Inner ear planes -->
  <path d="M55 30 L61 68 L70 58 Z"
        fill="#151a1d"
        stroke="#a5c736"
        stroke-opacity="0.42"
        stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M105 30 L99 68 L90 58 Z"
        fill="#151a1d"
        stroke="#a5c736"
        stroke-opacity="0.42"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Face planes -->
  <path d="M48 63 L72 78 L66 106 L49 94 Z"
        fill="#12171a"
        stroke="#a5c736"
