<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="160" fill="transparent"/>

  <!-- Tactical ring -->
  <circle cx="80" cy="82" r="58" stroke="#a5c736" stroke-opacity="0.22" stroke-width="2"/>

  <!-- K9 head outline -->
  <path d="M42 58
           L55 30
           L70 58
           L80 51
           L90 58
           L105 30
           L118 58
           L112 94
           L94 122
           L80 130
           L66 122
           L48 94
           Z"
