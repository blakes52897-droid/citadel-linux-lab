  <!-- Eyes -->
  <path d="M59 72 L73 75" stroke="#f3f2ec" stroke-width="5" stroke-linecap="round"/>
  <path d="M101 72 L87 75" stroke="#f3f2ec" stroke-width="5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M73 98 L87 98 L80 107 Z" fill="#a5c736"/>

  <!-- Lower guard mark -->
  <path d="M62 123 L80 145 L98 123"
